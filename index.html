<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Habits 2.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Golden <span class="highlight">Habits</span></h1>
            <p class="tagline">Turn consistency into content.</p>
        </header>

        <main>
            <section id="habit-form-section">
                <form id="habit-form">
                    <input type="text" id="habit-name" placeholder="New Habit (e.g. Meditate)" required maxlength="25">
                    <input type="text" id="habit-emoji" placeholder="🔥" required maxlength="2">
                    <button type="submit" id="add-habit-btn">Add</button>
                </form>
            </section>

            <section id="habit-list-section">
                <div id="habit-list">
                    <!-- Habits will be injected here -->
                </div>
            </section>
        </main>

        <!-- Share Modal -->
        <div id="share-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Your Progress Card</h2>
                <div id="card-preview-container">
                    <!-- Preview will be shown here -->
                </div>
                <button id="download-btn">Download Image</button>
            </div>
        </div>

        <canvas id="share-canvas" style="display:none;"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>

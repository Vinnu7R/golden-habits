<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Habits 2.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Golden <span class="highlight">Habits</span></h1>
            <p class="tagline">Turn consistency into content.</p>

            <div id="daily-summary" class="summary-card">
                <div class="summary-text">You completed <span id="completed-count">0</span>/<span id="total-count">0</span> today</div>
                <div class="summary-progress-bar"><div id="progress-fill"></div></div>
            </div>

            <div id="reminder-banner" class="banner hidden">
                🔔 Don't forget your habits today!
            </div>
        </header>

        <main>
            <section id="habit-form-section">
                <div class="form-header">
                    <h2>Add Habit</h2>
                    <button id="toggle-form-btn" class="icon-btn">+</button>
                </div>
                <form id="habit-form" class="collapsed">
                    <div class="input-group">
                        <input type="text" id="habit-name" placeholder="Name (e.g. Drink Water)" required maxlength="25">
                        <input type="text" id="habit-emoji" placeholder="🔥" required maxlength="2">
                    </div>
                    <div class="suggestions">
                        <button type="button" class="suggest-btn" data-name="Drink Water" data-emoji="💧">💧 Drink Water</button>
                        <button type="button" class="suggest-btn" data-name="Exercise" data-emoji="🏃">🏃 Exercise</button>
                        <button type="button" class="suggest-btn" data-name="Read" data-emoji="📚">📚 Read</button>
                    </div>
                    <button type="submit" id="add-habit-btn">Create Habit</button>
                </form>
            </section>

            <section id="habit-list-section">
                <div id="habit-list">
                    <!-- Habits will be injected here -->
                </div>
            </section>
        </main>

        <footer>
            <div class="settings-panel">
                <label class="switch-label">
                    <span>Daily Reminders</span>
                    <input type="checkbox" id="reminder-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </footer>

        <!-- Micro Reward Toast -->
        <div id="toast" class="toast hidden"></div>

        <!-- Share Modal -->
        <div id="share-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Share Achievement</h2>
                <div id="card-preview-container">
                    <!-- Preview will be shown here -->
                </div>
                <button id="download-btn">Download Image</button>
            </div>
        </div>

        <canvas id="share-canvas" style="display:none;"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
